<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews | SAFAR N MANZIL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Specific Styles for Reviews Page */
        .reviews-container {
            max-width: 1200px;
            margin: -6rem auto 4rem; /* Overlap with hero slightly */
            padding: 0 2rem;
            position: relative;
            z-index: 10;
        }
        
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
            align-items: start;
        }
        
        .review-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 155, 106, 0.15);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeUp 0.6s ease-out forwards;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle orange glow line at top of card */
        .review-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF9B6A, #FFBE92);
            opacity: 0;
            transition: all 0.4s ease;
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .review-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px rgba(255, 155, 106, 0.15);
            border-color: rgba(255, 155, 106, 0.4);
        }
        .review-card:hover::before {
            opacity: 1;
        }
        
        .stars {
            display: flex;
            gap: 0.2rem;
            margin-bottom: 1.2rem;
        }
        
        .stars svg {
            width: 22px;
            height: 22px;
            fill: #FF9B6A; /* Brand orange stars instead of generic yellow */
            color: #FF9B6A;
            filter: drop-shadow(0 2px 4px rgba(255, 155, 106, 0.3));
        }
        
        .review-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--clr-text-main);
            margin-bottom: 2rem;
            font-style: italic;
            font-weight: 600;
        }
        
        .review-author {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        
        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px; /* Squircle instead of perfect circle */
            background: linear-gradient(135deg, #FF9B6A, #FFBE92);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.3rem;
            box-shadow: 0 10px 20px rgba(255, 155, 106, 0.2);
        }
        
        .author-info h4 {
            font-weight: 800;
            color: var(--clr-text-main);
            margin: 0 0 0.2rem 0;
            font-size: 1.1rem;
        }
        
        .author-info span {
            font-size: 0.85rem;
            color: var(--clr-text-light);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading-state {
            text-align: center;
            padding: 8rem 4rem;
            font-size: 1.2rem;
            color: var(--clr-text-main);
            font-weight: 800;
        }
        
        .empty-state {
            text-align: center;
            padding: 5rem 4rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            border: 2px dashed rgba(255, 155, 106, 0.3);
            grid-column: 1 / -1;
            box-shadow: var(--shadow-soft);
        }
        .empty-state h3 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--clr-text-main);
            margin-bottom: 0.5rem;
        }
        .empty-state p {
            font-size: 1.1rem;
            color: var(--clr-text-light);
        }

        /* Adjust hero for inner pages */
        .dribbble-card-hero {
            height: 450px;
            align-items: center;
            justify-content: flex-start;
        }
        
        .dribbble-card-hero .main-title {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            margin-top: 3rem;
            text-align: center;
        }
        
        .dribbble-card-hero .description {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-light">
    
    <!-- Hero Section: The Dribbble Presentation -->
    <div class="presentation-bg" style="min-height: auto; padding-bottom: 8rem;">
        <div class="dribbble-card dribbble-card-hero shadow-lg">
            
            <!-- Hero Content -->
            <div style="width: 100%; padding: 0 2rem; position: relative; z-index: 2;">
                <h1 class="main-title text-center fade-in-up" style="color: white; margin-top: 1rem;">What Our <span style="font-family: 'Dancing Script', cursive;">Customers</span> Say</h1>
                <p class="description fade-in-up delay-1 text-center">Real stories and experiences from the people we've helped settle, travel, and thrive in the Gulf.</p>
            </div>
            
        </div>
    </div>
    
    <!-- Reviews Grid -->
    <section class="reviews-container">
        <div id="loading" class="loading-state fade-in-up">
            <span class="brand-name" style="font-size: 1.5rem;">SAFAR <span class="brand-n-badge" style="font-size: 1.5rem; margin: 0 4px;">N</span> MANZIL</span><br>
            <span style="display: block; margin-top: 1rem; opacity: 0.7;">Loading Customer Stories...</span>
        </div>
        <div id="reviews-grid" class="reviews-grid" style="display: none;">
            <!-- Reviews will be injected here via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer style="background: white; padding: 4rem 2rem; border-top: 1px solid rgba(0,0,0,0.05); text-align: center;">
        <div class="logo" style="justify-content: center; margin-bottom: 1.5rem; color: var(--clr-text-main);">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="#FF9B6A" style="width: 32px; height: 32px; transform: rotate(45deg);">
                <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13.5h-13L12 6.5z"/>
                <circle cx="12" cy="15" r="2.5" fill="white"/>
            </svg>
            <span class="logo-text">Safar <span class="logo-accent-dark">N</span> Manzil</span>
        </div>
        <p style="color: var(--clr-text-light); font-weight: 600;">© 2026 SAFAR N MANZIL. All Rights Reserved.</p>
    </footer>

    <!-- JS Files -->
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = "https://uzpnvylarbfttzhjqduj.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6cG52eWxhcmJmdHR6aGpxZHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTg4MjUsImV4cCI6MjEwMzU5NDgyNX0.64xT5zxppdu4zopmsm_CT4gaVsXemRZyv9tM6Lx46zU";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchReviews() {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('reviews-grid');

            try {
                const { data, error } = await supabaseClient
                    .from('customer_feedback')
                    .select('*')
                    .eq('status', 'approved')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loadingEl.style.display = 'none';
                gridEl.style.display = 'grid';

                if (!data || data.length === 0) {
                    gridEl.innerHTML = `
                        <div class="empty-state">
                            <h3>No reviews yet</h3>
                            <p>Check back soon to read customer experiences!</p>
                        </div>
                    `;
                    return;
                }

                gridEl.innerHTML = data.map((review, index) => {
                    const stars = Array(5).fill(0).map((_, i) => {
                        return i < review.rating 
                            ? `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
                            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                    }).join('');

                    const name = review.customer_name || 'Happy Customer';
                    const initial = name.charAt(0).toUpperCase();
                    
                    const date = new Date(review.created_at).toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', year: 'numeric'
                    });

                    return `
                        <div class="review-card" style="animation-delay: ${Math.min(index * 0.1, 1)}s">
                            <div class="stars">
                                ${stars}
                            </div>
                            <p class="review-text">"${review.comments || 'Excellent service!'}"</p>
                            <div class="review-author">
                                <div class="author-avatar">${initial}</div>
                                <div class="author-info">
                                    <h4>${name}</h4>
                                    <span>${date}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Error fetching reviews:", err);
                loadingEl.innerHTML = "Oops! We couldn't load the reviews right now.";
                loadingEl.style.color = "#E53E3E";
            }
        }

        document.addEventListener('DOMContentLoaded', fetchReviews);
    </script>
</body>
</html>
